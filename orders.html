<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order Status - Lab Inventory</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="app-layout">
<aside class="sidebar">

        <div class="sidebar-header">
            <div class="sidebar-logo">
                <div class="sidebar-logo-icon">🧪</div>
                <div class="sidebar-logo-text">
                    <h2>Lab Inventory</h2>
                    <p>Management System</p>
                </div>
            </div>
        </div>
        <nav class="sidebar-nav">
    
<a href="dashboard.html" class=""><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></a>
<a href="inventory.html?lab=physics" class=""><span class="nav-icon">⚛️</span><span class="nav-text">Physics</span></a>
<a href="inventory.html?lab=chemistry" class=""><span class="nav-icon">🧪</span><span class="nav-text">Chemistry</span></a>
<a href="inventory.html?lab=biology" class=""><span class="nav-icon">🧬</span><span class="nav-text">Biology</span></a>
<a href="reports.html" class=""><span class="nav-icon">📊</span><span class="nav-text">Reports</span></a>
<a href="orders.html" class="active"><span class="nav-icon">📦</span><span class="nav-text">Order Status</span></a>
<a href="notifications.html" class=""><span class="nav-icon">🔔</span><span class="nav-text">Notifications</span></a>

        </nav>
        <div class="sidebar-footer">
            <button type="button" class="logout-button" onclick="logout()">Logout</button>
        </div>
    </aside>
<main class="main-content">
<header class="page-header"><div><p class="page-header-label">Procurement</p><h1>Order Status</h1></div><div class="page-header-right">Logged in as <strong id="currentUsername">labassistant</strong></div></header>

<section class="panel">
<div class="section-heading"><p>Orders</p><h2>Additional Stock Orders</h2></div>
<div class="order-create-bar">
<select id="orderMaterial" class="select-input"></select>
<input id="orderQuantity" class="text-input" type="number" min="0.01" step="0.01" placeholder="Quantity">
<input id="orderDate" class="text-input" type="date">
<button class="primary-button" onclick="createOrder()">＋ Create Order</button>
</div>
<p id="orderFormError" class="form-error hidden"></p>
<div class="table-container"><table><thead><tr><th>Order ID</th><th>Material</th><th>Qty</th><th>Order Date</th><th>Status</th><th>Received</th><th>Action</th></tr></thead><tbody id="ordersTableBody"></tbody></table></div>
</section>
</main>
</div>
    <!-- Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <!-- Application logic -->
    <script src="js/app.js"></script>
</body>
</html>
