<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Inventory - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <div class="login-logo">🧪</div>
            <h1>Lab Inventory</h1>
            <p class="login-subtitle">Science Laboratory Management System</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" autocomplete="username" placeholder="Enter username or email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" placeholder="Enter password" required>
                </div>

                <p id="loginError" class="login-error hidden"></p>

                <button type="submit" class="btn btn-primary login-button">Login</button>
            </form>

            <div class="login-info">
                <strong>Demo Login</strong>
                <p>Username: <b>labassistant</b></p>
                <p>Password: <b>lab123</b></p>
            </div>
        </section>
    </main>
    <!-- Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <!-- Application logic -->
    <script src="js/app.js"></script>
</body>
</html>
